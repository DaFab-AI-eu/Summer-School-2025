    task: segmentation
    num_classes: 2
    image_grep:
      S2L1C: '*_S2Hand.tif'
    label_grep: '*_LabelHand.tif'
    train_label_data_root: /content/drive/MyDrive/EO_AI/sen1floods11_v1.1/data/LabelHand_v1
    val_label_data_root: /content/drive/MyDrive/EO_AI/sen1floods11_v1.1/data/LabelHand_v1
    test_label_data_root: /content/drive/MyDrive/EO_AI/sen1floods11_v1.1/data/LabelHand_v1 # other version
    train_split: /content/drive/MyDrive/EO_AI/sen1floods11_v1.1/splits/flood_train_data.txt
    val_split: /content/drive/MyDrive/EO_AI/sen1floods11_v1.1/splits/flood_valid_data.txt
    test_split: /content/drive/MyDrive/EO_AI/sen1floods11_v1.1/splits/flood_test_data.txt
    rgb_modality: S2L1C
    rgb_indices:
    - 2 #3
    - 1 #2
    - 0 #1
    allow_substring_file_names: true
    train_transform:
    - class_path: albumentations.RandomCrop
      init_args:
        height: 224
        width: 224
        always_apply: false
        p: 1.0
    - class_path: albumentations.D4
      init_args:
        p: 1.0
    - class_path: albumentations.pytorch.ToTensorV2
      init_args:
        transpose_mask: false
        p: 1.0
    shared_transforms: true
    expand_temporal_dimension: false
    no_data_replace: 0.0
    no_label_replace: -1.0
    reduce_zero_label: false
    drop_last: true
    num_workers: 2
    pin_memory: false
    data_with_sample_dim: false
    allow_missing_modalities: false
    sample_replace: false
    channel_position: -3
    concat_bands: false
    check_stackability: true
out_dtype: int16
deploy_config_file: true
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 5.0e-05
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.05
    amsgrad: false
    maximize: false
    capturable: false
    differentiable: false
lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 50
    eta_min: 0.0
    last_epoch: -1
